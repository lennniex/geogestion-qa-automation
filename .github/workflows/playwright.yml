name: Playwright QA - GeoGestión

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chrome para Playwright
        run: npx playwright install --with-deps chrome

      # Solo el proyecto "chrome" (sin ventana). El proyecto "chrome-captcha" necesita
      # que una persona marque "Soy humano", así que se ejecuta localmente con npm run test:captcha.
      - name: Ejecutar pruebas
        run: npm test

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 14
